name: Release

# Build field and diagnostic APKs and publish them as a GitHub Release.
#
# Two ways to trigger:
#   1. Push a tag:      git tag v0.3.37 && git push origin v0.3.37
#   2. Manual:          Actions → Release → Run workflow
#      (the tag is created automatically from the version in the build)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to create the tag + release

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          # REQUIRED: versionCode/versionName come from `git rev-list --count HEAD`.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build field and trace APKs
        run: ./gradlew :app:assembleField :app:assembleTrace --no-daemon

      - name: Resolve version and tag
        id: version
        run: |
          FIELD_APK=$(find app/build/outputs/apk/field -name '*.apk' | head -1)
          # Keep the trace APK under its own name. It was previously copied to
          # PalmAnnotate-debug-v<version>.apk, which made an asset labelled "debug"
          # actually carry applicationId dev.sawitulm.palmannotate.trace — an
          # operator downloading it in the field would install the debuggable app.
          TRACE_APK=$(find app/build/outputs/apk/trace -name '*.apk' | head -1)
          VERSION=$(basename "$FIELD_APK" .apk | sed 's/^PalmAnnotate-field-v//')
          echo "field_apk=$FIELD_APK" >> "$GITHUB_OUTPUT"
          echo "trace_apk=$TRACE_APK" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            # Guard: a tag pushed at the wrong commit would ship an APK whose
            # internal versionName does not match the tag. Fail loudly instead.
            if [ "$TAG" != "v$VERSION" ]; then
              echo "::error::Tag $TAG does not match built APK version v$VERSION."
              echo "::error::Tag the commit whose git rev-list --count HEAD equals the patch number."
              exit 1
            fi
          else
            TAG="v$VERSION"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        run: |
          {
            printf 'This release contains two apps with identical capture and output logic.\n\n'
            printf '**Install `PalmAnnotate-field-*.apk` for real dataset collection.**\n'
            printf 'Field: `dev.sawitulm.palmannotate.field`, non-debuggable, for real collection and performance measurement.\n'
            printf 'Trace: `dev.sawitulm.palmannotate.trace`, **debuggable and measurably slower**, for reproducing and tracing problems without replacing older app data. Do not collect a dataset with it.\n\n'
            printf '> Built by CI. **Not a substitute for on-device verification**. The Orbbec\n'
            printf '> live depth preview must still be checked on a physical device before any\n'
            printf '> field dataset collection. The CI debug signing key is not a durable update\n'
            printf '> identity unless repository signing secrets are configured.\n'
          } > "$RUNNER_TEMP/notes.md"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          FIELD_APK: ${{ steps.version.outputs.field_apk }}
          TRACE_APK: ${{ steps.version.outputs.trace_apk }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing APK assets."
            gh release upload "$TAG" "$FIELD_APK" "$TRACE_APK" --clobber
          else
            gh release create "$TAG" "$FIELD_APK" "$TRACE_APK" \
              --title "PalmAnnotate $VERSION" \
              --target "$GITHUB_SHA" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
