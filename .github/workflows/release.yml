name: Release

# Build a debug APK and publish it as a GitHub Release.
#
# Two ways to trigger:
#   1. Push a tag:      git tag v0.3.37 && git push origin v0.3.37
#   2. Manual:          Actions → Release → Run workflow
#      (the tag is created automatically from the version in the build)
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to create the tag + release

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          # REQUIRED: versionCode/versionName come from `git rev-list --count HEAD`.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Resolve version and tag
        id: version
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          VERSION=$(basename "$APK" .apk | sed 's/^PalmAnnotate-debug-v//')
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            # Guard: a tag pushed at the wrong commit would ship an APK whose
            # internal versionName does not match the tag. Fail loudly instead.
            if [ "$TAG" != "v$VERSION" ]; then
              echo "::error::Tag $TAG does not match built APK version v$VERSION."
              echo "::error::Tag the commit whose git rev-list --count HEAD equals the patch number."
              exit 1
            fi
          else
            TAG="v$VERSION"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        run: |
          {
            printf 'Debug build (`dev.sawitulm.palmannotate.debug`), arm64-v8a only.\n\n'
            printf '> Built by CI. **Not a substitute for on-device verification** — the Orbbec\n'
            printf '> live depth preview must still be checked on a physical device before any\n'
            printf '> field dataset collection.\n'
          } > "$RUNNER_TEMP/notes.md"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          APK: ${{ steps.version.outputs.apk }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — replacing the APK asset."
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "PalmAnnotate $VERSION" \
              --target "$GITHUB_SHA" \
              --notes-file "$RUNNER_TEMP/notes.md"
          fi
