name: Android Build

# Build field + diagnostic APKs on every push to master + on PRs.
# APKs are attached to the workflow run as artifacts (no GitHub Release).
# For a real Release with a permanent download link, push a tag — see release.yml.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  integrity:
    uses: ./.github/workflows/phase-a-integrity.yml

  # Deliberately NOT `needs: integrity`. The integrity gate runs an emulator, which is the
  # least reliable part of CI; letting it block APK production would mean an emulator flake
  # stops the operator getting a build. Releases stay fail-closed (release.yml gates on it).
  build:
    runs-on: ubuntu-latest

    env:
      # WS-21: same durable signer as release.yml when the secrets exist, so a per-push artifact
      # can update an installed Release without an uninstall. Unlike release.yml this job does
      # NOT require them: a fork/PR build has no secrets and must still produce an APK. Gradle
      # then falls back to the debug signer and renames the artifact `-NOKEY`, which is the
      # visible marker that the build cannot update anything.
      PALMANNOTATE_KEYSTORE_BASE64: ${{ secrets.PALMANNOTATE_KEYSTORE_BASE64 }}
      PALMANNOTATE_KEYSTORE_PASSWORD: ${{ secrets.PALMANNOTATE_KEYSTORE_PASSWORD }}
      PALMANNOTATE_KEY_ALIAS: ${{ secrets.PALMANNOTATE_KEY_ALIAS }}
      PALMANNOTATE_KEY_PASSWORD: ${{ secrets.PALMANNOTATE_KEY_PASSWORD }}

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          # REQUIRED: app/build.gradle.kts derives versionCode/versionName from
          # `git rev-list --count HEAD`. The default shallow clone (depth 1) would
          # make that return 1 and produce a bogus v0.3.1 APK.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build field and diagnostic APKs
        run: ./gradlew :app:assembleField :app:assembleDebug :app:assembleTrace --no-daemon

      - name: Resolve version
        id: version
        run: |
          APK=$(find app/build/outputs/apk/field -name '*.apk' | head -1)
          echo "version=$(basename "$APK" .apk | sed 's/^PalmAnnotate-field-v//')" >> "$GITHUB_OUTPUT"

      - name: Upload field APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PalmAnnotate-field-v${{ steps.version.outputs.version }}
          path: app/build/outputs/apk/field/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PalmAnnotate-debug-v${{ steps.version.outputs.version }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload side-by-side debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PalmAnnotate-trace-v${{ steps.version.outputs.version }}
          path: app/build/outputs/apk/trace/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          retention-days: 7
